name: ロト6出現回数の自動更新

on:
  schedule:
    # GitHub Actionsの時刻はUTC。JSTは+9時間。
    - cron: "0 14 * * 1,4"  # 月・木 23:00 JST（抽選 20:15 の約3時間後）
    - cron: "0 0 * * 2,5"   # 火・金 09:00 JST（データ源の反映が遅れた場合の保険）
  workflow_dispatch:        # 手動実行ボタンも使える

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 最新データを取得して集計
        run: python update_freq.py

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add freq.json
          git diff --cached --quiet || git commit -m "出現回数を自動更新"
          git push
